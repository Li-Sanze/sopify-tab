    <rect width="15" height="15" rx="5" fill="#262a33"/>
    <path fill="#b55c40" transform="translate(18 0)" d="M4.6875 0A10.3125 10.3125 0 0 1 15 10.3125A4.6875 4.6875 0 0 1 10.3125 15H4.6875A4.6875 4.6875 0 0 1 0 10.3125V4.6875A4.6875 4.6875 0 0 1 4.6875 0Z"/>
    <rect y="18" width="15" height="15" rx="5" fill="#262a33"/>
